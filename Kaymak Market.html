@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1510;--card:#13221a;--ink:#e8f1ea;--mut:#9db1a3;--line:#22372b;--lg:#bcd3ae}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;overflow-x:hidden;padding-bottom:90px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--sg);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}
.pi{width:100%;height:100%;pointer-events:none}
.logo{display:block;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;aspect-ratio:1738/957}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px var(--pad);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
header .logo{width:70px;color:var(--lg);flex:none}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:0 18px;height:46px;max-width:560px;color:var(--mut)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--ink)}
#cartbtn{position:relative;width:46px;height:46px;border-radius:50%;background:var(--g);color:#fff;margin-left:auto;flex:none;display:grid;place-items:center}
#badge{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;border-radius:99px;background:#ff5a3c;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.cats{display:flex;gap:12px;overflow-x:auto;padding:14px var(--pad) 8px;scrollbar-width:none}.cats::-webkit-scrollbar,#promos::-webkit-scrollbar{display:none}
.cat{flex:1 0 118px;height:116px;padding:14px 16px;border-radius:26px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;font-weight:800;font-size:15px;text-align:left;transition:background .25s,color .25s}
.ico{width:44px;height:44px;border-radius:50%;background:var(--sg);color:var(--g9);display:grid;place-items:center;transition:background .25s,color .25s}
.cat[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff}.cat[aria-pressed=true] .ico{background:#ffffff2e;color:#fff}
h2{font-size:clamp(24px,3.4vw,34px);letter-spacing:-.03em;font-weight:800}
.head{display:flex;align-items:baseline;gap:10px;padding:26px var(--pad) 12px}.head span{color:var(--mut);font-weight:600}
#promos{position:relative;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px var(--pad) 10px;scroll-padding-left:var(--pad);scrollbar-width:none;cursor:grab}
#promos.dg{scroll-snap-type:none;cursor:grabbing;user-select:none}
.promo{position:relative;flex:0 0 min(88%,560px);min-height:250px;border-radius:32px;padding:26px;overflow:hidden;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start}
.promo::before{content:"";position:absolute;right:-70px;top:-70px;width:280px;height:280px;border-radius:50%;background:color-mix(in srgb,currentColor 9%,transparent)}
.promo>*{position:relative;max-width:58%}
.tag{background:color-mix(in srgb,currentColor 16%,transparent);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:800}
.promo h3{font-size:clamp(24px,3.2vw,32px);line-height:1.05;letter-spacing:-.035em;font-weight:800;margin:14px 0 8px}
.promo p{font-size:14px;opacity:.85;flex:1}
.pb{margin-top:16px;padding:13px 22px;border-radius:99px;font-weight:800;transition:transform .5s var(--sp)}.pb:active{transform:scale(.92)}
.promo .pa{position:absolute;right:-8px;bottom:-16px;width:min(46%,210px);height:auto;max-width:none;aspect-ratio:1;transform:rotate(-10deg);filter:drop-shadow(0 14px 14px #0004)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:14px;padding:0 var(--pad)}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.promo{min-height:240px}.promo>*{max-width:62%}}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:10px 10px 12px;display:flex;flex-direction:column}
.art{position:relative;aspect-ratio:1;border-radius:18px;display:grid;place-items:center}
.art .pi{width:66%;height:66%;filter:drop-shadow(0 12px 8px #0003);transform:rotate(-6deg)}
.bd{position:absolute;left:8px;top:8px;background:#ff5a3c;color:#fff;font-style:normal;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px}.bd.g{background:var(--g)}
.pr{font-weight:800;font-size:19px;margin-top:12px;letter-spacing:-.02em}.pr s{color:var(--mut);font-size:13px;font-weight:600}
.nm{font-size:14px;line-height:1.25;flex:1;margin-top:2px;min-height:35px}.wt{color:var(--mut);font-size:12px;margin:2px 0 10px}
.ctl{display:flex;align-items:center;justify-content:space-between;height:44px;border-radius:99px;background:var(--g);color:#fff;font-weight:800}
.ctl .p:only-child{width:100%;height:100%;border-radius:99px}
.ctl .p,.ctl .m{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center}
.ctl:has(.m){background:color-mix(in srgb,var(--g) 14%,var(--card));color:var(--ink)}.ctl:has(.m) .p{background:var(--g);color:#fff}
.empty{grid-column:1/-1;color:var(--mut);padding:30px 0}
.fl{position:fixed;z-index:80;width:20px;height:20px;border-radius:50%;background:var(--g);pointer-events:none;left:0;top:0}
#bar{position:fixed;z-index:30;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 28px));display:flex;justify-content:space-between;background:var(--g9);color:#fff;border-radius:99px;padding:17px 26px;font-weight:800;box-shadow:0 14px 34px #0e3a2788;transform:translate(-50%,220%);transition:transform .6s var(--sp);cursor:pointer}
body.has #bar{transform:translate(-50%,0)}
footer{margin-top:56px;background:var(--g9);color:#fff;padding:48px var(--pad) 40px}
footer .logo{width:150px;margin-bottom:28px}
.br{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.br div{background:#ffffff14;border-radius:20px;padding:18px}.br b{display:block;font-size:17px}.br span{color:#cfe2d4;font-size:14px}
footer small{display:block;margin-top:24px;color:#cfe2d4}
#shade{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
#drawer{position:fixed;z-index:50;top:0;right:0;height:100%;width:min(420px,100%);background:var(--card);padding:22px;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .6s var(--sp)}
body.open #drawer{transform:none}body.open #shade{opacity:1;pointer-events:auto}

<script>
const $=s=>document.querySelector(s),SP='cubic-bezier(.3,1.6,.5,1)',rub=n=>n.toLocaleString('ru-RU'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`,pi=n=>`<svg class="pi"><use href="#p${n}"/></svg>`;
const CATS=[['all','Все товары','all'],['sweet','Сладости','candy'],['coffee','Кофе','cup'],['drinks','Напитки','bottle'],['food','Продукты','bag']];
const P=[[1,'Печенье с шоколадом','sweet',189,220,1,'#e6d9f6','150 г','-14%'],[2,'Драже шоколадное','sweet',240,0,2,'#fbe0c2','200 г','Хит'],[13,'Шоколад молочный','sweet',140,175,13,'#ead2c4','100 г','-20%'],[3,'Мармелад фруктовый','sweet',150,0,3,'#ffd3dc','175 г'],[4,'Кофе молотый, банка','coffee',690,0,4,'#f1dbc2','250 г','Новинка'],[5,'Кофе в зёрнах','coffee',1450,1650,5,'#e6d3bf','1 кг','-12%'],[6,'Сок яблочный','drinks',165,0,6,'#ffeaa6','1 л'],[7,'Лимонад газированный','drinks',90,0,7,'#c6ecd5','0,5 л'],[8,'Крылышки хрустящие','food',320,0,8,'#ffd9a6','500 г','Хит'],[9,'Паста итальянская','food',210,0,9,'#fff0b8','500 г'],[10,'Чипсы картофельные','food',175,0,10,'#ffe28a','140 г'],[11,'Сыр твёрдый','food',540,0,11,'#fff0ad','250 г','Новинка'],[12,'Пончики в глазури','sweet',110,130,12,'#fbd5e8','2 шт','-15%']];
const PR=[['Акция','20% скидка на шоколад','Плитки, драже и печенье дешевле','#4a2a1a','#fff',13,'q:шоколад','Смотреть'],['Рассрочка','0% на все товары','Покупайте сейчас, платите частями','#bcd3ae','#12261a',14,'all','Выбрать товары'],['Новинка','Свежий кофе и европейские сыры','Только что поступили на полки','#0e3a27','#fff',4,'coffee','Смотреть кофе'],['Хит','Хрустящие крылышки каждый день','Горячие, готовы к заказу','#ffd9a6','#12261a',8,'food','Заказать'],['Подборка','Сладости к чаю','Мармелад, пончики и печенье','#f3d7e6','#12261a',12,'sweet','Смотреть']];

function cats(){$('#cats').innerHTML=CATS.map(([k,n,i])=>`<button class="cat" data-c="${k}" aria-pressed="${k==cat}"><span class="ico">${ic(i)}</span>${n}</button>`).join('')}
function grid(){const L=P.filter(p=>(cat=='all'||p[2]==cat)&&p[1].toLowerCase().includes(q));$('#cnt').textContent=L.length+' шт.';
$('#grid').innerHTML=L.length?L.map(p=>`<article class="card"><div class="art" style="background:radial-gradient(circle at 50% 38%,#ffffffb0 0,${p[6]} 72%)">${pi(p[5])}${p[8]?`<i class="bd${p[8][0]=='-'?'':' g'}">${p[8]}</i>`:''}</div><div class="pr">${rub(p[3])} сом${p[4]?` <s>${rub(p[4])}</s>`:''}</div><div class="nm">${p[1]}</div><div class="wt">${p[7]}</div><div class="ctl" data-id="${p[0]}">${ctl(p[0])}</div></article>`).join(''):'<p class="empty">Ничего не найдено. Попробуйте другое слово.</p>'}
$('#promos').innerHTML=PR.map(([t,h,s,bg,fg,a,go,b])=>`<article class="promo" style="background:${bg};color:${fg}"><span class="tag">${t}</span><h3>${h}</h3><p>${s}</p><button class="pb" data-go="${go}" style="background:${fg};color:${bg}">${b}</button><svg class="pa"><use href="#p${a}"/></svg></article>`).join('');
function renderCart(){const ids=Object.keys(cart);let n=0,s=0;
$('#list').innerHTML=ids.length?ids.map(id=>{const p=find(id),c=cart[id];n+=c;s+=c*p[3];return`<div class="row"><i style="background:${p[6]}">${pi(p[5])}</i><div>${p[1]}<br><b>${rub(p[3]*c)} сом</b></div><div class="ctl" data-id="${id}">${ctl(id)}</div></div>`}).join(''):'<p class="empty">Пока пусто. Нажмите «Заказать» у товара.</p>';
$('#badge').textContent=$('#bn').textContent=n;$('#bs').textContent=$('#sum').textContent=rub(s);document.body.classList.toggle('has',n>0)}
function sync(id){document.querySelectorAll(`#grid .ctl[data-id="${id}"]`).forEach(e=>{e.innerHTML=ctl(id);e.animate([{transform:'scale(.92)'},{transform:'scale(1)'}],{duration:450,easing:SP})});renderCart();
$('#cartbtn').animate([{transform:'scale(1)'},{transform:'scale(1.22)'},{transform:'scale(1)'}],{duration:500,easing:SP})}
function fly(b){const r=b.getBoundingClientRect(),t=$('#cartbtn').getBoundingClientRect(),d=document.createElement('i');d.className='fl';document.body.append(d);
const x0=r.left+r.width/2-10,y0=r.top+r.height/2-10,x1=t.left+t.width/2-10,y1=t.top+t.height/2-10;
d.animate([{transform:`translate(${x0}px,${y0}px)`},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-80}px) scale(1.3)`,offset:.45},{transform:`translate(${x1}px,${y1}px) scale(.3)`}],{duration:650,easing:'cubic-bezier(.4,0,.6,1)'}).onfinish=()=>d.remove()}
function show(c,s){cat=c;q=s||'';$('#q').value=q;cats();grid();const a=$('.cat[aria-pressed=true]');a&&a.animate([{transform:'scale(.9)'},{transform:'scale(1)'}],{duration:500,easing:SP})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-p],[data-m],[data-c],[data-go]');if(!t)return;
if(t.dataset.c){show(t.dataset.c);return}
if(t.dataset.go){const g=t.dataset.go;g.startsWith('q:')?show('all',g.slice(2)):show(g);$('#catalog').scrollIntoView();return}
const id=t.dataset.p||t.dataset.m;cart[id]=(cart[id]||0)+(t.dataset.p?1:-1);if(cart[id]<1)delete cart[id];
if(t.dataset.p&&!t.closest('#drawer'))fly(t);sync(id)});
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();grid()};
const open=v=>document.body.classList.toggle('open',v);
$('#cartbtn').onclick=$('#bar').onclick=()=>open(1);$('#close').onclick=$('#shade').onclick=()=>open(0);
addEventListener('keydown',e=>e.key=='Escape'&&open(0));
$('#send').onclick=()=>{const t=$('#toast'),n=Object.keys(cart).length;t.textContent=n?'Демо: отправку заказа подключим позже':'Добавьте товары в заказ';if(n)open(0);t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)};
cats();grid();renderCart();
if(!RM)document.querySelectorAll('.cat').forEach((e,i)=>e.animate([{transform:'translateY(-70px) scale(.8)',opacity:0},{transform:'none',opacity:1}],{duration:800,delay:i*80,easing:SP,fill:'backwards'}));
/* promo carousel: drag with inertia + spring snap (mouse); touch uses native scroll */
const C=$('#promos');let dr=0,x0,s0,v=0,lx,lt,moved=0,raf;
C.addEventListener('pointerdown',e=>{if(e.pointerType!='mouse')return;cancelAnimationFrame(raf);dr=1;moved=0;C.classList.add('dg');x0=lx=e.clientX;s0=C.scrollLeft;v=0;lt=performance.now()});
addEventListener('pointermove',e=>{if(!dr)return;const n=performance.now();v=(lx-e.clientX)/(n-lt||1);lx=e.clientX;lt=n;moved=Math.max(moved,Math.abs(e.clientX-x0));C.scrollLeft=s0+x0-e.clientX});
addEventListener('pointerup',()=>{if(!dr)return;dr=0;let pos=C.scrollLeft,vel=v*1000,t0=performance.now(),proj=pos+vel*.25,pad=parseFloat(getComputedStyle(C).paddingLeft),t=0,bd=1e9;
[...C.children].forEach(c=>{const o=c.offsetLeft-pad,d=Math.abs(o-proj);if(d<bd){bd=d;t=o}});t=Math.max(0,Math.min(t,C.scrollWidth-C.clientWidth));
(function f(now){const dt=Math.min(.033,(now-t0)/1000);t0=now;vel+=((t-pos)*150-vel*17)*dt;pos+=vel*dt;C.scrollLeft=pos;
if(Math.abs(vel)<6&&Math.abs(t-pos)<.6){C.scrollLeft=t;C.classList.remove('dg')}else raf=requestAnimationFrame(f)})(t0)});
C.addEventListener('click',e=>{if(moved>5){e.stopPropagation();e.preventDefault();moved=0}},true);
</script></body></html>
